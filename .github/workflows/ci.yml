name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: vet
        run: go vet ./...

      - name: test (race)
        run: go test -race ./... -count=1

      - name: build
        run: go build ./...

      # The capability matrix is generated by tests; fail if the committed
      # copy is stale. This is what keeps docs from drifting from reality.
      - name: capability matrix up to date
        run: |
          go test ./test/capability/ -run TestCapabilityMatrix -count=1
          git diff --exit-code docs/capability-matrix.md

  datapath:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo build
        run: cargo build --release --manifest-path datapath/Cargo.toml

      - name: cargo test
        run: cargo test --manifest-path datapath/Cargo.toml
