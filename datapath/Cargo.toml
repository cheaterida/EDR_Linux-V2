[package]
name = "edr-datapath"
version = "0.1.0"
edition = "2021"
description = "EDR v2 datapath: fanotify synchronous decisions + response primitives"

[[bin]]
name = "edr-datapath"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
panic = "abort"
